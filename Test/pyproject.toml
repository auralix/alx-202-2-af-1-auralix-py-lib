# Auralix Python Library - offline tests: no instrument, no target. Every module is exercised over a
# fake transport (scripted serial port, scripted subprocess) so the suite runs on any machine:
#   cd Test && python -m pytest
# The library modules are imported from the repo root (pythonpath = ".."), no install step.
[project]
name = "alx-py-lib-tests"
version = "0.1.0"
description = "Offline tests for the Auralix Python Library (pytest over fake transports)"
requires-python = ">=3.10"
dependencies = [
    "pytest>=8",
    "pytest-html>=4",
    "pytest-timeout>=2",
    "pyserial>=3.5",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["."]
pythonpath = [".."]
timeout = 60
xfail_strict = true
addopts = "-ra --strict-markers --strict-config --junitxml=build/pytest_report.xml --html=build/pytest_report.html --self-contained-html"
markers = [
    "req(id): additional proof/requirement id attached by a LATER task (name keeps the originating token)",
]
junit_family = "xunit1"
filterwarnings = [
    "error",
]
